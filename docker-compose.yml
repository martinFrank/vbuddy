services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: vbuddy
      POSTGRES_USER: vbuddy
      POSTGRES_PASSWORD: vbuddy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vbuddy"]
      interval: 5s
      timeout: 5s
      retries: 5

  searxng:
    image: searxng/searxng:latest
    ports:
      - "8888:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/vbuddy
      SPRING_DATASOURCE_USERNAME: vbuddy
      SPRING_DATASOURCE_PASSWORD: vbuddy
      SEARXNG_BASE_URL: http://searxng:8080
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      searxng:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
