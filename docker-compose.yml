services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: vbuddy
      POSTGRES_USER: vbuddy
      POSTGRES_PASSWORD: vbuddy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vbuddy"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vbuddy_internal_net
      - default # remove on prod to hide it from external access

  searxng:
    image: searxng/searxng:latest
    ports:
      - "8888:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped
    networks:
      - vbuddy_internal_net
      - default # remove on prod to hide it from external access

  backend:
    build: ./backend
    ports:
      - "8080:8080" 
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/vbuddy
      SPRING_DATASOURCE_USERNAME: vbuddy
      SPRING_DATASOURCE_PASSWORD: vbuddy
      SEARXNG_BASE_URL: http://searxng:8080
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      searxng:
        condition: service_started
    networks:
      - vbuddy_internal_net
      - container_app_network

  frontend:
    build: ./frontend
    ports:
      - "3000:80" 
    depends_on:
      - backend
    networks:
      - vbuddy_internal_net
      - default # remove on prod to hide it from external access

volumes:
  pgdata:

networks:
  vbuddy_internal_net:
    internal: true
  container_app_network:
    external: true
