services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: vbuddy
      POSTGRES_USER: vbuddy
      POSTGRES_PASSWORD: vbuddy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vbuddy"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/vbuddy
      SPRING_DATASOURCE_USERNAME: vbuddy
      SPRING_DATASOURCE_PASSWORD: vbuddy
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
