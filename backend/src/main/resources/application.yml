server:
  servlet:
    context-path: /vbuddy

spring:
  application:
    name: vbuddy
  datasource:
    url: jdbc:postgresql://localhost:5432/vbuddy
    username: vbuddy
    password: vbuddy
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

langchain4j:
  open-ai:
    chat-model:
      base-url: ${OPENAI_BASE_URL:http://localhost:11434/v1}
      api-key: ${OPENAI_API_KEY:ollama}
      model-name: ${LLM_MODEL:llama3}
      temperature: 0.7
    embedding-model:
      base-url: ${OPENAI_BASE_URL:http://localhost:11434/v1}
      api-key: ${OPENAI_API_KEY:ollama}
      model-name: ${EMBEDDING_MODEL:nomic-embed-text}
