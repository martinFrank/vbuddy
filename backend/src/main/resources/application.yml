server:
  servlet:
    context-path: /vbuddy

spring:
  application:
    name: vbuddy
  datasource:
    url: jdbc:postgresql://localhost:5432/vbuddy
    username: vbuddy
    password: vbuddy
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

vbuddy:
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin}
  ai:
    planning:
      base-url: ${PLANNING_LLM_BASE_URL:http://localhost:11434/v1}
      api-key: ${PLANNING_LLM_API_KEY:ollama}
      model-name: ${PLANNING_LLM_MODEL:qwen3:14b}
      temperature: 0.7
      timeout-seconds: ${PLANNING_LLM_TIMEOUT_SECONDS:300}
    execution:
      base-url: ${EXECUTION_LLM_BASE_URL:http://localhost:11434/v1}
      api-key: ${EXECUTION_LLM_API_KEY:ollama}
      model-name: ${EXECUTION_LLM_MODEL:qwen3:8b}
      temperature: 0.7
      timeout-seconds: ${EXECUTION_LLM_TIMEOUT_SECONDS:300}
    chat:
      base-url: ${CHAT_LLM_BASE_URL:http://localhost:11434/v1}
      api-key: ${CHAT_LLM_API_KEY:ollama}
      model-name: ${CHAT_LLM_MODEL:llama3.1:8b}
      temperature: 0.7
      timeout-seconds: ${CHAT_LLM_TIMEOUT_SECONDS:120}
    schedule:
      base-url: ${SCHEDULE_LLM_BASE_URL:http://localhost:11434/v1}
      api-key: ${SCHEDULE_LLM_API_KEY:ollama}
      model-name: ${SCHEDULE_LLM_MODEL:qwen3:14b}
      temperature: 0.8
      timeout-seconds: ${SCHEDULE_LLM_TIMEOUT_SECONDS:300}
    embedding:
      base-url: ${EMBEDDING_BASE_URL:http://localhost:11434/v1}
      api-key: ${EMBEDDING_API_KEY:ollama}
      model-name: ${EMBEDDING_MODEL:nomic-embed-text}
  wordpress:
    url: ${WORDPRESS_URL:}
    username: ${WORDPRESS_USERNAME:}
    password: ${WORDPRESS_PASSWORD:}
  searxng:
    base-url: ${SEARXNG_BASE_URL:http://localhost:8888}
    max-results: 5
    language: de
    enabled: true
